<aside class="sidebar">
  <div class="sidebar-inner">
    <div class="site-name">
      <a href="/">{{ site.Title }}</a>
    </div>

    <nav class="nav">
      {{ $currentSection := "" }}
      {{ if .Section }}{{ $currentSection = printf "/%s/" .Section }}{{ end }}
      {{ range site.Data.nav.items }}
        <a class="nav-link {{ if eq $currentSection .url }}active{{ end }}" href="{{ .url }}">{{ .label | lower }}</a>
      {{ end }}
    </nav>
  </div>
</aside>
